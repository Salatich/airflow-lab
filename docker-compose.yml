services:
  # ============================================================================
  # 1. PostgreSQL 16 Metadata Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ============================================================================
  # 2. MinIO S3-Compatible Object Store (Custom XCom Backend Target)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: airflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  minio-create-bucket:
    image: amazon/aws-cli:latest
    container_name: airflow-minio-init
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: >
      -c "
      export AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin};
      export AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin};
      export AWS_DEFAULT_REGION=us-east-1;
      until aws --endpoint-url http://minio:9000 s3 mb s3://${MINIO_BUCKET_NAME:-airflow-xcom-bucket} 2>/dev/null || aws --endpoint-url http://minio:9000 s3 ls s3://${MINIO_BUCKET_NAME:-airflow-xcom-bucket} 2>/dev/null; do
        echo 'Waiting for MinIO service to respond...';
        sleep 2;
      done;
      echo 'MinIO bucket initialized successfully!';
      exit 0;
      "

  # ============================================================================
  # 3. Airflow Common Environment Configuration (Shared Base)
  # ============================================================================
  airflow-common: &airflow-common
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5}
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: 32
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 16
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 16
      AIRFLOW__CORE__DAG_CONCURRENCY: 16
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=}
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "false"
      AIRFLOW__CORE__XCOM_BACKEND: custom_xcom_backend.MinIOXComBackend
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      PYTHONPATH: /opt/airflow/plugins:/opt/airflow/src
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-amazon>=8.0.0 boto3>=1.35.0}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-airflow-xcom-bucket}
      XCOM_S3_KEY_PREFIX: ${XCOM_S3_KEY_PREFIX:-xcom/}
      XCOM_SIZE_THRESHOLD_BYTES: ${XCOM_SIZE_THRESHOLD_BYTES:-1024}
      AWS_CONN_ID: aws_minio
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./include:/opt/airflow/include
      - ./logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"

  # ============================================================================
  # 4. Airflow Initialization (Database Migration & Connections)
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username "${AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname "Lead" \
          --lastname "Engineer" \
          --role "Admin" \
          --email "salatich@users.noreply.github.com" || true && \
        airflow connections add 'aws_minio' \
          --conn-type 'aws' \
          --conn-extra '{"endpoint_url": "http://minio:9000", "aws_access_key_id": "minioadmin", "aws_secret_access_key": "minioadmin"}' || true
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully

  # ============================================================================
  # 5. Airflow Webserver (UI on Port 8080)
  # ============================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================================
  # 6. Airflow Scheduler
  # ============================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================================
  # 7. Airflow Triggerer (Async Event Loop for Deferrable Operators)
  # ============================================================================
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$$HOSTNAME\""]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
